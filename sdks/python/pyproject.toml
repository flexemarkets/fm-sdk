[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-sdk"
dynamic = ["version"]
description = "Python SDK for the Flexemarkets API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Flexemarkets", email = "support@flexemarkets.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "coverage>=7",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/flexemarkets/fm-sdk"
Documentation = "https://github.com/flexemarkets/fm-sdk#readme"
Repository = "https://github.com/flexemarkets/fm-sdk.git"
Issues = "https://github.com/flexemarkets/fm-sdk/issues"

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["fm"]

# The SDK, which ships py.typed so a caller's checker reads these annotations, and
# the two examples a reader runs first. first_robot called desk.markets(), a
# property, and every test passed because the fake desk had a method of that name
# while desk was declared `object`, which nothing can check. check_untyped_defs
# because an unannotated helper is where such a call hides.
[tool.mypy]
python_version = "3.11"
files = ["fm", "first_robot.py", "ticker.py"]
check_untyped_defs = true

[tool.coverage.run]
source = ["fm"]

# The release gate over critical code: what places and cancels orders, signs
# in, and keeps a desk's books current. Every line of it is covered, so
# fail_under is 100: a line added here without a test that reaches it fails
# the build. `make test-python`; `coverage report -m` names the line.
[tool.coverage.report]
include = [
    "fm/client.py",
    "fm/decimals.py",
    "fm/desk.py",
    "fm/events.py",
    "fm/order_stream.py",
    "fm/order_utils.py",
    "fm/orderbook.py",
    "fm/trades.py",
]
fail_under = 100
precision = 1
