[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-sdk"
dynamic = ["version"]
description = "Python SDK for the Flexemarkets API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Flexemarkets", email = "support@flexemarkets.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "coverage>=7",
]

[project.urls]
Homepage = "https://github.com/flexemarkets/fm-sdk"
Documentation = "https://github.com/flexemarkets/fm-sdk#readme"
Repository = "https://github.com/flexemarkets/fm-sdk.git"
Issues = "https://github.com/flexemarkets/fm-sdk/issues"

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["fm"]

[tool.coverage.run]
source = ["fm"]

# The release gate over critical code: what places and cancels orders, signs
# in, and keeps a desk's books current. fail_under is today's coverage, so it
# can only go up; raise it as tests land, toward 90. `make test-python`.
[tool.coverage.report]
include = [
    "fm/client.py",
    "fm/desk.py",
    "fm/events.py",
    "fm/order_utils.py",
    "fm/orderbook.py",
    "fm/trades.py",
]
fail_under = 77.9
precision = 1
