# The suite injects dropped streams, failed reseeds and throwing handlers on
# purpose, and the desk logs each one, so a passing build would print dozens of
# WARNING and SEVERE lines. No handlers keeps them off the console. Levels stay
# as they are: a test that adds its own handler to a logger still hears it.
#
# To see them while debugging a test, set this to java.util.logging.ConsoleHandler.
handlers=
